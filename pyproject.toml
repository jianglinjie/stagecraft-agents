[project]
name = "stagecraft-agents"
version = "0.1.0"
description = "Multi-agent orchestration for staged content production: dispatch-and-return, shared plan store, resumable turns, MCP."
readme = "README.md"
authors = [
    { name = "Jayden", email = "jianglinjie1990@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai-agents",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "mcp>=2.2.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stagecraft"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
